name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun run build --mode pages --base=/alt-history/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for the branch publish when Pages uses branch mode
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="repos/$GITHUB_REPOSITORY"
          if [[ "$(gh api "$repo/pages" --jq .build_type)" == "legacy" ]]; then
            runs="$repo/actions/runs?event=dynamic&head_sha=$GITHUB_SHA"
            until [[ "$(gh api "$runs" --jq '[.workflow_runs[] | select(.path == "dynamic/pages/pages-build-deployment")][0].status')" == "completed" ]]; do
              sleep 10
            done
          fi
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
